# Route list for OWASP Juice Shop v20.4.0 (bkimminich/juice-shop:v20.4.0), the stand-in site in
# deploy/docker-compose.yml until Harold's site is ready.
# Sources: server.ts and frontend/src/app at tag v20.4.0, plus the file list of the release build.
# {name} = one non-empty path segment; a trailing /** = any remainder; methods absent = any method.
# asset: true keeps a route on the list but out of R2 endpoint breadth.
#
# The Angular client uses hash routing (#/login, #/basket, #/search ...), so every client page is
# a request for "/". The list holds what a shopper's browser loads: the shell, the build files and
# the /rest and /api calls of the shop, account, basket, checkout, contact and privacy pages.
# Left off on purpose, so they count as contract exits: the /ftp listing (only /ftp/legal.md is
# linked), /encryptionkeys, /support/logs, /metrics, /api-docs, /b2b/v2, /snippets, /rest/web3,
# accounting and admin-only endpoints, and the easter-egg paths.
# The root build files carry content hashes; regenerate their entries when the image tag changes.
routes:
  - pattern: "/"
    methods: [GET, HEAD]
  - pattern: "/index.html"
    asset: true
  - pattern: "/main.js"
    asset: true
  - pattern: "/polyfills.js"
    asset: true
  - pattern: "/scripts.js"
    asset: true
  - pattern: "/styles.css"
    asset: true
  - pattern: "/rolldown-runtime-kqx1xuJ_.js"
    asset: true
  - pattern: "/chunk-3CyVWL1v.js"
    asset: true
  - pattern: "/chunk-6hZgLGBt.js"
    asset: true
  - pattern: "/chunk-CajNVifV.js"
    asset: true
  - pattern: "/chunk-CE5v8pBj.js"
    asset: true
  - pattern: "/chunk-DLf-Pb_Q.js"
    asset: true
  - pattern: "/chunk-gXZw0I0M.js"
    asset: true
  - pattern: "/about.component-HWmrgSem.js"
    asset: true
