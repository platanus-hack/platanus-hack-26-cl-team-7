# Version 0 thresholds. Starting values from the plan; step 6 tunes them on the tune set only.
r1_exits:
  min_exits: 5          # fires at 5 or more requests outside the route list ...
  window_seconds: 300   # ... within 5 minutes
r2_breadth:
  max_endpoints: 10     # fires at MORE than 10 distinct endpoints ...
  window_seconds: 60    # ... within 60 seconds
r3_flags:
  enabled: true
session:
  idle_timeout_seconds: 1800
