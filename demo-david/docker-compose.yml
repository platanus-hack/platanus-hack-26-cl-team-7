services:
  app:
    build: .
    ports:
      - "3111:3111"
    volumes:
      - budget-data:/data
    environment:
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET before starting}
      - DB_PATH=/data/budget.db
      - PORT=3111
      - NODE_ENV=production
    restart: unless-stopped

volumes:
  budget-data:
