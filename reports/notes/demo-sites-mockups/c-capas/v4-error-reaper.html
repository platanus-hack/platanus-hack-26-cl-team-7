<style type="text/tailwindcss">
@theme static {
  --font-sans: "Onest", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* capas: canvas > sheet > tile > well */
  --color-canvas: #ebe5da;
  --color-sheet: #f6f2ea;
  --color-tile: #fdfbf7;
  --color-well: #eee8dd;
  --color-line: #e2dacd;
  --color-line-2: #d2c8b8;

  --color-ink: #27211c;
  --color-ink-2: #5a5148;
  --color-ink-3: #7a7064;
  --color-ink-4: #aea496;

  /* acento unico: arcilla */
  --color-clay: #b4583a;
  --color-clay-2: #964329;
  --color-clay-soft: #f1dcd0;
  --color-clay-wash: #f8ebe3;
  --color-clay-line: #e8cbbb;

  /* datos: calmos, sin saturar */
  --color-sage: #5f806a;
  --color-sage-soft: #dde9df;
  --color-sage-ink: #3a5842;
  --color-ochre: #a67a2c;
  --color-ochre-soft: #f1e6c9;
  --color-ochre-ink: #6c4d11;
  --color-slate: #5b7c90;
  --color-slate-soft: #dbe6ec;
  --color-slate-ink: #355669;
  --color-wine: #9c3d4a;
  --color-wine-soft: #f0d9db;
  --color-sand: #d8ccb9;

  --radius-tile: 28px;
  --radius-card: 20px;
  --radius-ctl: 14px;
  --radius-chip: 10px;

  --text-micro: 11.5px;
  --text-micro--line-height: 1.4;
  --text-caption: 12.5px;
  --text-caption--line-height: 1.45;
  --text-small: 13.5px;
  --text-small--line-height: 1.5;
  --text-body: 15px;
  --text-body--line-height: 1.55;
  --text-lead: 17px;
  --text-lead--line-height: 1.5;
  --text-title: 22px;
  --text-title--line-height: 1.25;
  --text-h1: 30px;
  --text-h1--line-height: 1.12;
  --text-display: 44px;
  --text-display--line-height: 1.05;
}

@layer base {
  html { background: var(--color-canvas); }
  body {
    margin: 0; font-family: var(--font-sans); font-size: 15px; line-height: 1.55;
    color: var(--color-ink); background: var(--color-canvas);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  button { cursor: pointer; }
  ::selection { background: var(--color-clay-soft); }
  :focus-visible { outline: 2px solid var(--color-clay); outline-offset: 2px; }
  svg.i { flex: none; }
}

@layer components {
  /* capas */
  .sheet { background: var(--color-sheet); border-radius: 32px; }
  .tile { background: var(--color-tile); border: 1px solid var(--color-line); border-radius: var(--radius-tile); }
  .tile-sm { background: var(--color-tile); border: 1px solid var(--color-line); border-radius: var(--radius-card); }
  .well { background: var(--color-well); border-radius: var(--radius-card); }
  .well-sm { background: var(--color-well); border-radius: var(--radius-ctl); }
  .tint { background: var(--color-clay-wash); border: 1px solid var(--color-clay-line); border-radius: var(--radius-tile); }

  .eyebrow { font-size: 11.5px; line-height: 1.4; letter-spacing: .07em; text-transform: uppercase; color: var(--color-ink-3); font-weight: 500; }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.045em; font-feature-settings: "zero"; font-weight: 500; }
  .num .d { font-style: normal; margin: 0 -.13em 0 -.1em; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

  /* controles tactiles */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 17px;
    border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--color-ink);
    background: var(--color-tile); border: 1px solid var(--color-line-2);
    box-shadow: inset 0 1px 0 #fff, 0 1px 1px rgb(70 50 30 / .06);
    transition: background .15s, transform .08s, box-shadow .15s;
  }
  .btn:hover { background: #fff; }
  .btn:active { transform: translateY(1px); box-shadow: inset 0 1px 3px rgb(70 50 30 / .14); }
  .btn-sm { height: 34px; padding: 0 14px; font-size: 13px; gap: 6px; }
  .btn-icon { width: 40px; padding: 0; }
  .btn-accent {
    background: var(--color-clay); color: #fff7f1; border-color: var(--color-clay-2);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .22), inset 0 -1px 0 rgb(0 0 0 / .12), 0 1px 1px rgb(120 50 20 / .22);
  }
  .btn-accent:hover { background: #bd6040; }
  .btn-accent:active { box-shadow: inset 0 2px 4px rgb(0 0 0 / .22); }
  .btn-ghost { background: transparent; border-color: transparent; box-shadow: none; }
  .btn-ghost:hover { background: rgb(255 255 255 / .55); }
  .btn[disabled], .btn.is-off { color: var(--color-ink-4); background: var(--color-well); border-color: var(--color-line); box-shadow: none; cursor: not-allowed; transform: none; }

  .field {
    width: 100%; height: 46px; padding: 0 16px; border-radius: var(--radius-ctl); font: inherit; font-size: 15px; color: var(--color-ink);
    background: var(--color-tile); border: 1px solid var(--color-line-2);
    box-shadow: inset 0 1px 2px rgb(70 50 30 / .06);
    transition: border-color .15s, box-shadow .15s;
  }
  .field::placeholder { color: var(--color-ink-4); }
  .field:focus { outline: none; border-color: var(--color-clay); box-shadow: 0 0 0 4px rgb(180 88 58 / .14); }
  .field-pill { border-radius: 999px; }

  .seg { display: inline-flex; padding: 4px; gap: 2px; border-radius: 999px; background: var(--color-well); box-shadow: inset 0 1px 2px rgb(70 50 30 / .09); }
  .seg > * { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--color-ink-2); white-space: nowrap; background: transparent; border: 0; }
  .seg > .on { background: var(--color-tile); color: var(--color-ink); box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgb(70 50 30 / .14); }

  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; color: var(--color-ink-2); background: var(--color-well); white-space: nowrap; }
  .chip-clay { background: var(--color-clay-soft); color: var(--color-clay-2); }
  .chip b { font-weight: 600; color: var(--color-ink); }
  .chip-clay b { color: var(--color-clay-2); }

  .st { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 99px; background: currentColor; opacity: .85; }
  .st-ok { background: var(--color-sage-soft); color: var(--color-sage-ink); }
  .st-warn { background: var(--color-ochre-soft); color: var(--color-ochre-ink); }
  .st-info { background: var(--color-slate-soft); color: var(--color-slate-ink); }
  .st-mute { background: var(--color-well); color: var(--color-ink-2); }
  .st-bad { background: var(--color-wine-soft); color: var(--color-wine); }

  .delta { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 500; height: 22px; padding: 0 8px; border-radius: 99px; }
  .delta-up { background: var(--color-sage-soft); color: var(--color-sage-ink); }
  .delta-warn { background: var(--color-ochre-soft); color: var(--color-ochre-ink); }
  .delta-flat { background: var(--color-well); color: var(--color-ink-2); }

  .kbd { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 7px; font-family: var(--font-mono); font-size: 11.5px; color: var(--color-ink-3); background: var(--color-well); box-shadow: inset 0 -1px 0 var(--color-line-2); }

  .sw { position: relative; width: 44px; height: 26px; border-radius: 99px; background: var(--color-line-2); box-shadow: inset 0 1px 3px rgb(70 50 30 / .18); flex: none; border: 0; padding: 0; transition: background .2s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 99px; background: #fff; box-shadow: 0 1px 2px rgb(70 50 30 / .28); transition: transform .2s; }
  .sw.on { background: var(--color-clay); }
  .sw.on::after { transform: translateX(18px); }

  .cb { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--color-line-2); background: var(--color-tile); display: inline-grid; place-items: center; flex: none; color: #fff; }
  .cb.on { background: var(--color-clay); border-color: var(--color-clay-2); }

  .avatar { display: inline-grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: 99px; font-size: 12.5px; font-weight: 600; letter-spacing: .02em; }
  .av-clay { background: var(--color-clay-soft); color: var(--color-clay-2); }
  .av-sage { background: var(--color-sage-soft); color: var(--color-sage-ink); }
  .av-slate { background: var(--color-slate-soft); color: var(--color-slate-ink); }
  .av-ochre { background: var(--color-ochre-soft); color: var(--color-ochre-ink); }
  .av-sand { background: var(--color-sand); color: var(--color-ink); }

  .ico-disc { display: inline-grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 99px; background: var(--color-well); color: var(--color-clay); }

  /* navegacion */
  .nav-i { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--color-ink-2); transition: background .15s, color .15s; }
  .nav-i:hover { background: rgb(255 255 255 / .5); color: var(--color-ink); }
  .nav-i.on { background: var(--color-tile); color: var(--color-ink); box-shadow: inset 0 1px 0 #fff, 0 0 0 1px var(--color-line), 0 1px 2px rgb(70 50 30 / .08); }
  .nav-i.on svg { color: var(--color-clay); }

  /* tabla en filas de grilla */
  .tr { display: grid; grid-template-columns: var(--cols); column-gap: 12px; align-items: center; padding: 13px 22px; border-top: 1px solid var(--color-line); }
  .tr:hover { background: rgb(238 232 221 / .35); }
  .tr.th { border-top: 0; padding-top: 14px; padding-bottom: 12px; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-ink-3); font-weight: 500; background: transparent; }
  .tr.th:hover { background: transparent; }
  .tr.sel { background: var(--color-clay-wash); }

  /* linea de tiempo de nomina */
  .tl { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); }
  .tl-s { position: relative; padding: 44px 10px 0 0; }
  .tl-n { position: absolute; top: 0; left: 0; width: 32px; height: 32px; border-radius: 99px; display: grid; place-items: center; background: var(--color-well); border: 1.5px solid var(--color-line-2); color: var(--color-ink-3); font-family: var(--font-mono); font-size: 12px; }
  .tl-s::before { content: ""; position: absolute; top: 15px; left: 42px; right: 10px; height: 2px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--color-line-2) 0 5px, transparent 5px 9px); }
  .tl-s:last-child::before { display: none; }
  .tl-s.done::before { background: var(--color-clay); }
  .tl-s.done .tl-n { background: var(--color-clay); border-color: var(--color-clay-2); color: #fff7f1; box-shadow: inset 0 1px 0 rgb(255 255 255 / .22); }
  .tl-s.now .tl-n { background: var(--color-tile); border: 2px solid var(--color-clay); color: var(--color-clay); box-shadow: 0 0 0 5px var(--color-clay-soft); }
  .tl-t { font-size: 14px; font-weight: 600; line-height: 1.25; }
  .tl-m { margin-top: 3px; font-size: 12.5px; color: var(--color-ink-3); line-height: 1.35; }
  .tl-s.pend .tl-t { color: var(--color-ink-2); font-weight: 500; }
  .tl-v { grid-template-columns: 1fr; }
  .tl-v .tl-s { padding: 4px 0 24px 50px; min-height: 48px; }
  .tl-v .tl-s:last-child { padding-bottom: 0; }
  .tl-v .tl-s::before { top: 38px; bottom: 6px; left: 15px; right: auto; width: 2px; height: auto; background: repeating-linear-gradient(180deg, var(--color-line-2) 0 5px, transparent 5px 9px); }
  .tl-v .tl-s.done::before { background: var(--color-clay); }
  @media (max-width: 719px) {
    .tl { grid-template-columns: 1fr; }
    .tl-s { padding: 4px 0 24px 50px; min-height: 48px; }
    .tl-s:last-child { padding-bottom: 0; }
    .tl-s::before { top: 38px; bottom: 6px; left: 15px; right: auto; width: 2px; height: auto; background: repeating-linear-gradient(180deg, var(--color-line-2) 0 5px, transparent 5px 9px); }
    .tl-s.done::before { background: var(--color-clay); }
  }

  /* indicador de staging del portal: una sola linea corta */
  .stg { display: flex; align-items: center; justify-content: center; gap: 8px; height: 30px; padding: 0 16px; background: #efe3c3; border-bottom: 1px solid #e0cf9f; color: var(--color-ochre-ink); font-size: 12.5px; line-height: 1; white-space: nowrap; }
  .stg::before { content: ""; width: 6px; height: 6px; border-radius: 9px; background: #c9972f; }
}


</style>
</head>
