# Mirror-lane stack: Caddy serves one public site; the router (python -m mirror) is the live
# detector and picks the lane per request; flagged agents reach the twin shop, which runs the same
# code on masked data; Sentinel stores every track, action and finding.
# Run from the repository root, with SENTINEL_INGEST_TOKEN set (deploy/.env is gitignored), and
# PUBLIC_HOST set to the site's public host name or IP, which the callback relay never reaches:
#   docker compose -f deploy/docker-compose.yml up --build
#   docker compose -f deploy/docker-compose.yml --profile eval run --rm replay   (eval replay)
#
# Volumes keep the real side and the twin apart. The twin mounts only twin-sockets (its own
# socket and the relay socket) and twin-data (its masked copy); it never sees real data or
# real-side sockets. Services without network_mode none are the ones that need TCP: Caddy (public
# port), the router (Sentinel, callback relay) and Sentinel (dashboard, AI).
#   edge-sockets  /run/edge   real.sock lane.sock tap.sock sync.sock    real sync router caddy
#   twin-sockets  /run/twin   twin.sock relay.sock                      twin router twin-egress
#                                                                       relay-bridge
#   real-data     /data/real  real.db real-files                        seed mask real sync
#   twin-data     /data/twin  twin.db twin-files                        seed mask twin sync
#   mirror-state  /app/run    canaries.json mirror-keys.jsonl spool     mask router
# The twin has no network, so its callback fetches leave through two socat bridges: twin-egress
# (in the twin's network namespace) turns 127.0.0.1:8097 into relay.sock, and relay-bridge (in the
# router's namespace) turns relay.sock back into the router's relay on 127.0.0.1:8097.
name: agent-detect

x-mirror: &mirror
  build:
    context: ..
    dockerfile: deploy/mirror.Dockerfile
  image: agent-detect/mirror:local
  restart: unless-stopped

x-bridge: &bridge
  build:
    context: ..
    dockerfile: deploy/socat.Dockerfile
  image: agent-detect/socat:local
  restart: unless-stopped
  volumes:
    - twin-sockets:/run/twin

services:
  seed:
    <<: *mirror
    restart: "no"
    network_mode: none
    # Runs until it succeeds once; a seed that died halfway starts again from an empty database.
    # A new seed also deletes the mask's marker, so the twin is masked again from the new data.
    command:
      - sh
      - -c
      - >-
        test -f /data/real/seed.done || {
        rm -f /data/real/real.db /data/real/real.db-wal /data/real/real.db-shm
        /data/twin/mask.done &&
        python -m demo.seed --db /data/real/real.db &&
        touch /data/real/seed.done; }
    volumes:
      - real-data:/data/real
      - twin-data:/data/twin

  mask:
    <<: *mirror
    restart: "no"
    network_mode: none
    depends_on:
      seed:
        condition: service_completed_successfully
    # Canaries go to the router's mirror-state volume (/app/run), never beside the twin's data.
    command:
      - sh
      - -c
      - >-
        test -f /data/twin/mask.done || {
        rm -f /data/twin/twin.db /data/twin/twin.db-wal /data/twin/twin.db-shm &&
        python -m demo.mask --from /data/real/real.db --to /data/twin/twin.db
        --allow config/mask.yaml --canaries run/canaries.json &&
        touch /data/twin/mask.done; }
    volumes:
      - real-data:/data/real
      - twin-data:/data/twin
      - mirror-state:/app/run

  real:
    <<: *mirror
    network_mode: none
    depends_on:
      seed:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - demo
      - --socket
      - /run/edge/real.sock
      - --db
      - /data/real/real.db
      - --files
      - /data/real/real-files
    volumes:
      - edge-sockets:/run/edge
      - real-data:/data/real

  twin:
    <<: *mirror
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    depends_on:
      mask:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - demo
      - --socket
      - /run/twin/twin.sock
      - --db
      - /data/twin/twin.db
      - --files
      - /data/twin/twin-files
      - --egress-proxy
      - http://127.0.0.1:8097
    volumes:
      - twin-sockets:/run/twin
      - twin-data:/data/twin

  twin-egress:
    <<: *bridge
    network_mode: service:twin
    depends_on:
      - twin
    command:
      - TCP-LISTEN:8097,bind=127.0.0.1,fork,reuseaddr
      - UNIX-CONNECT:/run/twin/relay.sock

  sync:
    <<: *mirror
    network_mode: none
    depends_on:
      mask:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - demo.sync
      - --socket
      - /run/edge/sync.sock
      - --real
      - /data/real/real.db
      - --twin
      - /data/twin/twin.db
    volumes:
      - edge-sockets:/run/edge
      - real-data:/data/real
      - twin-data:/data/twin

  router:
    <<: *mirror
    depends_on:
      - real
      - twin
      - sync
      - sentinel
    environment:
      SENTINEL_INGEST_TOKEN: ${SENTINEL_INGEST_TOKEN:?set SENTINEL_INGEST_TOKEN in deploy/.env}
    command:
      - python
      - -m
      - mirror
      - --lane
      - /run/edge/lane.sock
      - --tap
      - /run/edge/tap.sock
      - --relay
      - 127.0.0.1:8097
      - --relay-block-host
      - ${PUBLIC_HOST:-localhost}
      - --real
      - /run/edge/real.sock
      - --twin
      - /run/twin/twin.sock
      - --sync
      - /run/edge/sync.sock
      - --sentinel
      - http://sentinel:8787
      - --state
      - run/mirror-keys.jsonl
      - --spool
      - run/mirror-spool.jsonl
      - --canaries
      - run/canaries.json
    volumes:
      - edge-sockets:/run/edge
      - twin-sockets:/run/twin
      - mirror-state:/app/run

  relay-bridge:
    <<: *bridge
    network_mode: service:router
    depends_on:
      - router
    command:
      - UNIX-LISTEN:/run/twin/relay.sock,fork,unlink-early,mode=600
      - TCP:127.0.0.1:8097

  sentinel:
    build:
      context: ..
      dockerfile: deploy/sentinel.Dockerfile
    image: agent-detect/sentinel:local
    restart: unless-stopped
    environment:
      SENTINEL_INGEST_TOKEN: ${SENTINEL_INGEST_TOKEN:?set SENTINEL_INGEST_TOKEN in deploy/.env}
      # The router posts to http://sentinel:8787; any other host name is refused.
      SENTINEL_ALLOWED_HOSTS: sentinel
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      # Loopback only: the dashboard has no login.
      - "127.0.0.1:8787:8787"
    volumes:
      - sentinel-data:/data

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    # Started after the shop and router so the mirror image creates edge-sockets with its owner.
    depends_on:
      - real
      - router
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./lanes.caddy:/etc/caddy/lanes.caddy:ro
      - edge-sockets:/run/edge
      - caddy-logs:/var/log/caddy

  replay:
    build:
      context: ..
      dockerfile: deploy/engine.Dockerfile
    profiles:
      - eval
    network_mode: none
    command:
      - replay
      - /var/log/caddy/access.log
    volumes:
      - caddy-logs:/var/log/caddy:ro

volumes:
  edge-sockets:
  twin-sockets:
  real-data:
  twin-data:
  mirror-state:
  sentinel-data:
  caddy-logs:
