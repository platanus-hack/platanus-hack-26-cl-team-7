[project]
name = "agent-detect"
version = "0.0.1"
description = "AI agent detection v0: three rules over a Caddy JSON access log."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "diff-cover>=9.2",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PL"]
ignore = ["PLR2004", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR0913"]
# Standing lint exception (CONSTRAINTS.md "Lint exceptions"): seeded, non-crypto RNG that makes
# synthetic data reproducible. Owner team-7, review 2027-05-21. Synthetic-data modules only.
"eval/synthetic.py" = ["S311"]
"eval/tail.py" = ["S311"]
"eval/base_rate.py" = ["S311"]
"eval/convert/csic.py" = ["S311"]
# Standing lint exception (CONSTRAINTS.md "Lint exceptions"): the demo shop's planted SQL
# injection login flaw builds its SQL from text on purpose. Owner team-7, review 2027-05-21.
"demo/auth.py" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
# source_pkgs (not source) keeps repo-relative file names in coverage.xml, so diff-cover never
# mixes up engine/__init__.py with dashboard/__init__.py.
source_pkgs = ["engine", "eval", "dashboard", "scripts", "demo", "mirror"]
branch = true

# File size limits. Exceptions need an owner and an end date (see CONSTRAINTS.md).
[tool.check_size]
source_limit = 200
test_limit = 300
roots = ["engine", "eval", "dashboard", "scripts", "demo", "mirror", "tests"]
exceptions = []
