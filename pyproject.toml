[project]
name = "agent-detect"
version = "0.0.1"
description = "AI agent detection v0: three rules over a Caddy JSON access log."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "diff-cover>=9.2",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PL"]
ignore = ["PLR2004", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR0913"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["engine", "eval", "dashboard", "scripts", "demo"]
branch = true

# File size limits. Exceptions need an owner and an end date (see CONSTRAINTS.md).
[tool.check_size]
source_limit = 200
test_limit = 300
roots = ["engine", "eval", "dashboard", "scripts", "demo", "tests"]
exceptions = []
