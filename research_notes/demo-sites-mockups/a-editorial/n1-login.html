<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Bruma Consola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..700;1,400&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<style>html{background:#F3EEE3;color:#16140E}body{margin:0}</style>
<style type="text/tailwindcss">
@theme {
  --color-paper: #F3EEE3;
  --color-paper-2: #EAE3D3;
  --color-sheet: #FBF8F1;
  --color-ink: #16140E;
  --color-ink-2: #454036;
  --color-ink-3: #6E685C;
  --color-rule: #D6CCB8;
  --color-rule-2: #E4DCCB;
  --color-forest: #1E4B38;
  --color-forest-2: #2B6549;
  --color-moss: #DAE4D3;
  --color-ochre: #A85F12;
  --color-ochre-soft: #F0DDB2;
  --color-brick: #9A3626;
  --color-brick-soft: #F1D9D0;
  --font-serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-sans: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 14px;
  --text-micro: 0.6875rem;
  --text-micro--line-height: 1rem;
  --text-heading: 1.5rem;
  --text-heading--line-height: 1.2;
  --text-title: 2.75rem;
  --text-title--line-height: 1.04;
  --text-fig: 2.75rem;
  --text-fig--line-height: 1;
  --text-fig-lg: 5.5rem;
  --text-fig-lg--line-height: 0.95;
}
@layer base {
  html { background: var(--color-paper); color: var(--color-ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { font-size: 15px; line-height: 1.45; min-height: 100vh; }
  ::selection { background: var(--color-moss); }
  :focus-visible { outline: 2px solid var(--color-forest); outline-offset: 2px; border-radius: 2px; }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  a { color: inherit; text-decoration: none; }
}
@layer components {
  .ic { width: 1.125rem; height: 1.125rem; flex: none; }
  .label { font-size: .6875rem; line-height: 1rem; letter-spacing: .09em; text-transform: uppercase; font-weight: 500; color: var(--color-ink-3); }
  .fig { font-family: var(--font-serif); font-variant-numeric: tabular-nums lining-nums; font-feature-settings: "tnum", "lnum"; letter-spacing: -.02em; font-weight: 350; }
  .tnum { font-variant-numeric: tabular-nums; }
  .serif { font-family: var(--font-serif); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; height: 2.5rem; padding: 0 1.1rem; border-radius: var(--radius-sm); font-size: .875rem; font-weight: 500; white-space: nowrap; transition: background-color .15s, color .15s, border-color .15s, transform .1s; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--color-ink); color: var(--color-paper); }
  .btn-primary:hover { background: var(--color-forest); }
  .btn-ghost { border: 1px solid var(--color-ink); color: var(--color-ink); }
  .btn-ghost:hover { background: var(--color-ink); color: var(--color-paper); }
  .link { background: linear-gradient(currentColor, currentColor) 0 100% / 100% 1px no-repeat; padding-bottom: 1px; transition: background-size .2s; }
  .link:hover { background-size: 0 1px; }
  .status { display: inline-flex; align-items: center; gap: .5rem; font-size: .8125rem; font-weight: 500; white-space: nowrap; }
  .status::before { content: ""; width: .5rem; height: .5rem; border-radius: 99px; background: currentColor; }
  .status-ok { color: var(--color-forest); }
  .status-warn { color: var(--color-ochre); }
  .status-bad { color: var(--color-brick); }
  .status-idle { color: var(--color-ink-3); }
  .status-idle::before { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
  .ledger { width: 100%; border-collapse: collapse; }
  .ledger thead th { text-align: left; padding: .6rem .75rem; font-size: .6875rem; letter-spacing: .09em; text-transform: uppercase; font-weight: 500; color: var(--color-ink-3); border-top: 3px double var(--color-ink); border-bottom: 1px solid var(--color-ink); white-space: nowrap; }
  .ledger tbody td { padding: .85rem .75rem; border-bottom: 1px solid var(--color-rule); vertical-align: middle; font-variant-numeric: tabular-nums; }
  .ledger tbody tr:hover td { background: var(--color-sheet); }
  .ledger .r { text-align: right; }
  .ledger-tight thead th, .ledger-tight tbody td { padding-left: .5rem; padding-right: .5rem; }
  .ledger tr > :first-child { padding-left: 0; }
  .ledger tr > :last-child { padding-right: 0; }
  .avatar { width: 2rem; height: 2rem; border-radius: 99px; display: inline-grid; place-items: center; font-size: .6875rem; font-weight: 600; letter-spacing: .03em; flex: none; }
  .tag { display: inline-flex; align-items: center; height: 1.25rem; padding: 0 .45rem; border-radius: var(--radius-xs); font-size: .6875rem; font-weight: 500; letter-spacing: .02em; }
  .field { display: block; width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--color-ink); padding: .6rem 0; font-size: 1rem; color: var(--color-ink); border-radius: 0; }
  .field::placeholder { color: color-mix(in srgb, var(--color-ink-3) 75%, transparent); }
  .field:focus { outline: none; border-bottom-color: var(--color-forest); box-shadow: 0 1px 0 0 var(--color-forest); }
  .kbd { font-family: var(--font-sans); font-size: .6875rem; font-weight: 500; padding: .1rem .35rem; border: 1px solid var(--color-rule); border-radius: var(--radius-xs); color: var(--color-ink-3); background: var(--color-sheet); }
}
</style>
</head>
<body class="bg-paper text-ink">
<div class="min-h-screen lg:grid lg:grid-cols-[1.05fr_1fr]">
  <section class="relative bg-forest text-paper overflow-hidden px-6 py-6 lg:px-14 lg:py-12 flex flex-col lg:min-h-screen">
    <div class="absolute inset-0 opacity-[.13] pointer-events-none" style="background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 39px, #F3EEE3 39px, #F3EEE3 40px)"></div>
    <div class="absolute inset-y-0 left-[4.5rem] lg:left-[7.5rem] w-px bg-paper/20 pointer-events-none hidden sm:block"></div>
    <div class="relative">
  <span class="inline-flex items-center gap-2.5">
    <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#F3EEE3"/><circle cx="16" cy="13.5" r="7" fill="#1E4B38"/><rect x="7" y="14.6" width="18" height="1.5" fill="#F3EEE3"/><rect x="7" y="17.9" width="18" height="1.5" fill="#F3EEE3"/><rect x="8" y="23.6" width="16" height="1.8" rx=".9" fill="#1E4B38" opacity=".55"/></svg>
    <span class="font-serif text-[1.5rem] leading-none font-medium tracking-tight text-paper">Bruma</span>
    <span class="label !text-paper/70 pt-0.5">Consola</span>
  </span></div>
    <div class="relative hidden lg:flex flex-1 items-center lg:pl-[calc(7.5rem-3.5rem+1.75rem)]">
      <p class="serif text-[clamp(3.5rem,6vw,5.75rem)] leading-[.96] tracking-[-0.03em] font-light">Cada peso,<br><em class="font-light">en su línea.</em></p>
    </div>
  </section>

  <section class="flex flex-col px-6 py-10 sm:px-12 lg:px-16 lg:py-12">
    <div class="flex-1 flex items-center">
      <div class="w-full max-w-[400px] mx-auto">
        <h1 class="serif text-[2.75rem] leading-none tracking-tight">Inicia sesión</h1>

        <form class="mt-12 space-y-8" onsubmit="return false">
          <div>
            <label for="email" class="label block">Correo</label>
            <input id="email" type="email" autocomplete="username" placeholder="nombre.apellido@empresa.cl" class="field mt-1">
          </div>
          <div>
            <label for="pw" class="label block">Contraseña</label>
            <div class="relative">
              <input id="pw" type="password" autocomplete="current-password" class="field mt-1 pr-10" value="">
              <button type="button" class="absolute right-0 top-1/2 -translate-y-1/2 mt-0.5 size-8 grid place-items-center text-ink-3 hover:text-ink" aria-label="Mostrar contraseña"><svg class="ic " viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M245.48,125.57c-.34-.78-8.66-19.23-27.24-37.81C201,70.54,171.38,50,128,50S55,70.54,37.76,87.76c-18.58,18.58-26.9,37-27.24,37.81a6,6,0,0,0,0,4.88c.34.77,8.66,19.22,27.24,37.8C55,185.47,84.62,206,128,206s73-20.53,90.24-37.75c18.58-18.58,26.9-37,27.24-37.8A6,6,0,0,0,245.48,125.57ZM128,194c-31.38,0-58.78-11.42-81.45-33.93A134.77,134.77,0,0,1,22.69,128,134.56,134.56,0,0,1,46.55,95.94C69.22,73.42,96.62,62,128,62s58.78,11.42,81.45,33.94A134.56,134.56,0,0,1,233.31,128C226.94,140.21,195,194,128,194Zm0-112a46,46,0,1,0,46,46A46.06,46.06,0,0,0,128,82Zm0,80a34,34,0,1,1,34-34A34,34,0,0,1,128,162Z"/></svg></button>
            </div>
          </div>
          <label class="flex items-center gap-3 text-[14px] cursor-pointer select-none">
            <input type="checkbox" class="size-4 accent-forest" checked>
            <span>Mantener sesión</span>
          </label>
          <button class="btn btn-primary w-full !h-12 text-[15px]">Ingresar<svg class="ic " viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M220.24,132.24l-72,72a6,6,0,0,1-8.48-8.48L201.51,134H40a6,6,0,0,1,0-12H201.51L139.76,60.24a6,6,0,0,1,8.48-8.48l72,72A6,6,0,0,1,220.24,132.24Z"/></svg></button>
        </form>

        <button class="mt-4 w-full h-12 inline-flex items-center justify-center gap-2.5 rounded-sm border border-rule text-ink-2 text-[15px] hover:border-ink hover:text-ink"><svg class="ic " viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M208,82H174V56a46,46,0,0,0-92,0V82H48A14,14,0,0,0,34,96V208a14,14,0,0,0,14,14H208a14,14,0,0,0,14-14V96A14,14,0,0,0,208,82ZM94,56a34,34,0,0,1,68,0V82H94ZM210,208a2,2,0,0,1-2,2H48a2,2,0,0,1-2-2V96a2,2,0,0,1,2-2H208a2,2,0,0,1,2,2Z"/></svg>Continuar con SSO</button>
      </div>
    </div>
    <footer class="mt-10 pt-5 border-t border-rule text-[13px]">
      <a href="#" class="text-ink-3 hover:text-ink link">¿Olvidaste tu contraseña?</a>
    </footer>
  </section>
</div>
</body></html>
